<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>E-Bülten Toplantı Anketi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <style>
      /* Tek sütun: önce kişinin cevabı, sonra herkesin oylarından oluşan gün × saat tablosu. Sadece açık tema. */
      :root {
        --bg: #f7fafa;
        --surface: #ffffff;
        --fg: #26343a;
        --muted: #6b7c83;
        --line: #e2eaec;
        --accent: #3a9ea0;
        --accent-fg: #ffffff;
        --heat-0: #f7fafa;
        --heat-rgb: 58, 158, 160;
        --best: #c7922f;
        --best-soft: #fbf1dc;
        --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.5;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 32px 48px;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }
      h1 {
        font-size: clamp(24px, 4vw, 32px);
        line-height: 1.15;
        margin: 0;
        text-wrap: balance;
        font-weight: 700;
      }
      .lede {
        color: var(--muted);
        margin: 0;
        max-width: 62ch;
      }
      h2 {
        font-size: 17px;
        margin: 0;
        font-weight: 600;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 340px;
      }
      input[type="text"] {
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 11px;
      }
      input[type="text"]:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .scroll {
        overflow-x: auto;
      }
      .days {
        display: grid;
        grid-template-columns: repeat(5, minmax(96px, 1fr));
        gap: 10px;
        min-width: 520px;
      }
      .day {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .day h3 {
        margin: 0 0 2px;
        font-size: 13px;
        font-weight: 600;
      }
      .day h3 span {
        display: block;
        color: var(--muted);
        font-weight: 400;
        font-size: 12px;
      }
      .slot {
        font-family: var(--font-mono);
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        border-radius: 6px;
        padding: 7px 4px;
        transition:
          background 0.12s,
          border-color 0.12s;
      }
      .slot:hover {
        border-color: var(--accent);
      }
      .slot[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        padding: 10px 18px;
        background: var(--accent);
        color: var(--accent-fg);
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        font-weight: 500;
      }
      .status {
        font-size: 13px;
        color: var(--muted);
      }
      .status.ok {
        color: var(--accent);
      }
      .notice {
        font-size: 14px;
        color: var(--muted);
        background: var(--bg);
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 14px;
      }
      .best {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        display: inline-flex;
        gap: 8px;
        align-items: baseline;
        background: var(--best-soft);
        color: var(--fg);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 13px;
      }
      .chip b {
        font-family: var(--font-mono);
        color: var(--best);
      }
      .heat {
        display: grid;
        grid-template-columns: 92px repeat(5, minmax(120px, 1fr));
        gap: 4px;
        min-width: 700px;
      }
      .heat .hd {
        font-size: 12.5px;
        font-weight: 600;
        padding: 4px 6px;
      }
      .heat .hd span {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 11.5px;
      }
      .heat .tm {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--muted);
        padding: 8px 4px;
        font-variant-numeric: tabular-nums;
      }
      .cell {
        border-radius: 6px;
        padding: 6px 8px;
        min-height: 44px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        border: 1px solid transparent;
      }
      .cell .n {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
      }
      .cell .who {
        font-size: 11.5px;
        line-height: 1.3;
      }
      .cell.top {
        border-color: var(--best);
        box-shadow: inset 0 0 0 1px var(--best);
      }
      .cell.top .n {
        color: var(--best);
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .legend i {
        display: inline-block;
        width: 22px;
        height: 12px;
        border-radius: 3px;
      }
      .people {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .people b {
        color: var(--fg);
        font-weight: 600;
      }
      @media (prefers-reduced-motion: reduce) {
        .slot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="eyebrow">İTÜ Maden Fakültesi · E-Bülten Ekibi</div>
        <h1>E-Bülten Toplantı Anketi</h1>
        <p class="lede">
          Ekibin ilk toplantısı için uygun zamanı belirliyoruz. Toplantı 1 saat sürecek. Adını yaz, katılabileceğin saatlerin hepsini işaretle ve kaydet.
        </p>
      </header>

      <section class="card" aria-labelledby="mine-h">
        <h2 id="mine-h">Senin uygunluğun</h2>
        <div class="field">
          <label for="name">Ad Soyad</label>
          <input type="text" id="name" autocomplete="name" maxlength="80" />
        </div>
        <div class="scroll"><div class="days" id="days"></div></div>
        <div class="actions">
          <button class="btn" id="save" type="button">Kaydet</button>
          <button class="btn ghost" id="clear" type="button">Seçimleri temizle</button>
          <span class="status" id="status" role="status"></span>
        </div>
      </section>

      <section class="card" aria-labelledby="res-h">
        <h2 id="res-h">Sonuçlar</h2>
        <div id="bestBox"></div>
        <div id="results"><div class="notice">Cevaplar yükleniyor…</div></div>
      </section>
    </div>

    <script>
      // Google Apps Script web uygulamasının adresi
      const API = "https://script.google.com/macros/s/AKfycbzuym2wegFVz5NREN8TJQLQMZvACSRnVqR7q4QlV_5w14UnOJwKcKlTFvgwYUb5ylzuhA/exec";

      const DAYS = [
        { key: "2026-11-09", label: "9 Kasım", wd: "Pazartesi" },
        { key: "2026-11-10", label: "10 Kasım", wd: "Salı" },
        { key: "2026-11-11", label: "11 Kasım", wd: "Çarşamba" },
        { key: "2026-11-12", label: "12 Kasım", wd: "Perşembe" },
        { key: "2026-11-13", label: "13 Kasım", wd: "Cuma" },
      ];
      const TIMES = [];
      for (let h = 8; h < 17; h++) TIMES.push(String(h).padStart(2, "0") + ":00");
      const range = (t) => t + "–" + String(+t.slice(0, 2) + 1).padStart(2, "0") + ":00";
      const SLOTS = [];
      DAYS.forEach((d) => TIMES.forEach((t) => SLOTS.push({ id: d.key + "T" + t, day: d, time: t })));
      const VALID = new Set(SLOTS.map((s) => s.id));
      const norm = (s) => (s || "").trim().replace(/\s+/g, " ").toLocaleLowerCase("tr");

      const $ = (id) => document.getElementById(id);
      let picked = new Set();
      let responses = [];
      let prefilled = false;
      let dirty = false;

      function store(k, v) {
        try {
          if (v === undefined) return localStorage.getItem(k);
          localStorage.setItem(k, v);
        } catch (e) {
          return null;
        }
      }

      function buildPicker() {
        const box = $("days");
        box.innerHTML = "";
        DAYS.forEach((d) => {
          const col = document.createElement("div");
          col.className = "day";
          const h = document.createElement("h3");
          h.textContent = d.label;
          const s = document.createElement("span");
          s.textContent = d.wd;
          h.appendChild(s);
          col.appendChild(h);
          TIMES.forEach((t) => {
            const id = d.key + "T" + t;
            const b = document.createElement("button");
            b.type = "button";
            b.className = "slot";
            b.textContent = range(t);
            b.setAttribute("aria-pressed", picked.has(id) ? "true" : "false");
            b.setAttribute("aria-label", d.label + " " + d.wd + " " + range(t));
            b.addEventListener("click", () => {
              picked.has(id) ? picked.delete(id) : picked.add(id);
              b.setAttribute("aria-pressed", picked.has(id) ? "true" : "false");
              dirty = true;
              setStatus("Kaydedilmemiş değişiklik var");
            });
            col.appendChild(b);
          });
          box.appendChild(col);
        });
      }

      function setStatus(msg, ok) {
        const s = $("status");
        s.textContent = msg || "";
        s.className = "status" + (ok ? " ok" : "");
      }

      function renderResults() {
        const box = $("results"),
          best = $("bestBox");
        if (!responses.length) {
          box.innerHTML = '<div class="notice">Henüz cevap yok. İlk cevabı yukarıdan sen ekleyebilirsin.</div>';
          best.innerHTML = "";
          return;
        }
        const total = responses.length;
        const who = {};
        SLOTS.forEach((s) => (who[s.id] = []));
        responses.forEach((r) =>
          (r.slots || []).forEach((id) => {
            if (VALID.has(id)) who[id].push(r.name || "İsimsiz");
          })
        );
        const max = Math.max(...SLOTS.map((s) => who[s.id].length));

        best.innerHTML = "";
        if (max > 0) {
          const tops = SLOTS.filter((s) => who[s.id].length === max);
          const lab = document.createElement("div");
          lab.className = "status";
          lab.textContent =
            max === total
              ? `Herkesin uygun olduğu ${tops.length > 1 ? "saatler" : "saat"}:`
              : `En çok kişinin uygun olduğu ${tops.length > 1 ? "saatler" : "saat"} (${max}/${total} kişi):`;
          const wrap = document.createElement("div");
          wrap.className = "best";
          tops.forEach((s) => {
            const c = document.createElement("span");
            c.className = "chip";
            const a = document.createElement("span");
            a.textContent = s.day.label + " " + s.day.wd;
            const b = document.createElement("b");
            b.textContent = range(s.time);
            c.append(a, b);
            wrap.appendChild(c);
          });
          best.append(lab, wrap);
        }

        box.innerHTML = "";
        const ppl = document.createElement("div");
        ppl.className = "people";
        const names = responses.map((r) => r.name || "İsimsiz").sort((a, b) => a.localeCompare(b, "tr"));
        const nb = document.createElement("b");
        nb.textContent = total;
        ppl.append(nb, " kişi cevap verdi: " + names.join(", "));
        box.appendChild(ppl);

        const sc = document.createElement("div");
        sc.className = "scroll";
        const g = document.createElement("div");
        g.className = "heat";
        g.appendChild(document.createElement("div"));
        DAYS.forEach((d) => {
          const h = document.createElement("div");
          h.className = "hd";
          h.textContent = d.label;
          const s = document.createElement("span");
          s.textContent = d.wd;
          h.appendChild(s);
          g.appendChild(h);
        });
        TIMES.forEach((t) => {
          const tm = document.createElement("div");
          tm.className = "tm";
          tm.textContent = range(t);
          g.appendChild(tm);
          DAYS.forEach((d) => {
            const list = who[d.key + "T" + t],
              n = list.length;
            const c = document.createElement("div");
            c.className = "cell" + (n === max && max > 0 ? " top" : "");
            c.style.background = n ? `rgba(var(--heat-rgb),${(0.12 + (0.5 * n) / total).toFixed(2)})` : "var(--heat-0)";
            c.title = n ? list.join(", ") : "Uygun kimse yok";
            const nn = document.createElement("span");
            nn.className = "n";
            nn.textContent = `${n}/${total}`;
            c.appendChild(nn);
            if (n) {
              const w = document.createElement("span");
              w.className = "who";
              w.textContent = list.sort((a, b) => a.localeCompare(b, "tr")).join(", ");
              c.appendChild(w);
            }
            g.appendChild(c);
          });
        });
        sc.appendChild(g);
        box.appendChild(sc);

        const lg = document.createElement("div");
        lg.className = "legend";
        lg.innerHTML =
          '<span>Az</span><i style="background:rgba(var(--heat-rgb),.15)"></i><i style="background:rgba(var(--heat-rgb),.35)"></i>' +
          '<i style="background:rgba(var(--heat-rgb),.6)"></i><span>Çok kişi uygun</span>' +
          '<i style="background:var(--best-soft);border:1px solid var(--best);margin-left:10px"></i><span>En uygun</span>';
        box.appendChild(lg);
      }

      function prefillFromResponses() {
        if (prefilled || dirty) return;
        const saved = store("anket-ad");
        if (!saved) return;
        const mine = responses.find((r) => norm(r.name) === norm(saved));
        prefilled = true;
        $("name").value = saved;
        if (mine) {
          picked = new Set((mine.slots || []).filter((id) => VALID.has(id)));
          buildPicker();
          setStatus("Önceki cevabın yüklendi.", true);
        }
      }

      async function load() {
        if (!API) {
          $("results").innerHTML = '<div class="notice">Anket henüz bağlanmadı.</div>';
          return;
        }
        try {
          const r = await fetch(API + "?t=" + Date.now());
          const j = await r.json();
          if (!j.ok) throw new Error("bad");
          responses = j.responses || [];
          prefillFromResponses();
          renderResults();
        } catch (e) {
          if (!responses.length) $("results").innerHTML = '<div class="notice">Cevaplara şu an ulaşılamıyor. Sayfayı biraz sonra yenile.</div>';
        }
      }

      buildPicker();
      $("clear").addEventListener("click", () => {
        picked.clear();
        dirty = true;
        buildPicker();
        setStatus("Kaydedilmemiş değişiklik var");
      });

      let saving = false;
      $("save").addEventListener("click", async () => {
        if (saving) return;
        const name = $("name").value.trim().replace(/\s+/g, " ");
        if (!name) {
          setStatus("Lütfen adını yaz.");
          $("name").focus();
          return;
        }
        if (!API) {
          setStatus("Anket henüz bağlanmadı.");
          return;
        }
        saving = true;
        $("save").disabled = true;
        setStatus("Kaydediliyor…");
        try {
          const r = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ name, slots: [...picked].filter((id) => VALID.has(id)) }),
          });
          const j = await r.json();
          if (!j.ok) throw new Error(j.error || "bad");
          store("anket-ad", name);
          dirty = false;
          setStatus("Kaydedildi ✓", true);
          responses = j.responses || responses;
          renderResults();
        } catch (e) {
          setStatus("Kaydedilemedi, tekrar dene.");
        } finally {
          saving = false;
          $("save").disabled = false;
        }
      });

      load();
      setInterval(() => {
        if (!document.hidden) load();
      }, 30000);
    </script>
  </body>
</html>
